:root{
  --turq:#0097A9; --turq-dark:#007D8C; --turq-soft:#E3F3F5;
  --ink:#383636; --ink-2:#5E5A5A; --ink-3:#817C7C;
  --ground:#F2F6F7; --surface:#FFFFFF; --line:#D5E1E4; --line-2:#E7EEF0;
  --amber:#9A5B00; --amber-soft:#FFF2DB;
  --red:#B3261E; --red-soft:#FBE7E5;
  --green:#1F7A4D; --green-soft:#E1F3E9;
  --grey-soft:#ECEFF0;
  --bubble:#E9E9EB; --bubble-ink:#1D1D1F;
  --shadow:0 1px 2px rgba(56,54,54,.06),0 4px 16px rgba(56,54,54,.06);
  --radius:12px;
  --font:"Lato","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --turq:#27B4C5; --turq-dark:#5CCAD7; --turq-soft:#113A40;
    --ink:#ECEBEB; --ink-2:#C2BEBE; --ink-3:#9A9595;
    --ground:#1A1D1E; --surface:#252A2B; --line:#3A4244; --line-2:#30373A;
    --amber:#F0B45A; --amber-soft:#3A2C12; --red:#FF8A80; --red-soft:#3D1D1B;
    --green:#6FD19D; --green-soft:#16362A; --grey-soft:#30373A;
    --bubble:#3A3A3C; --bubble-ink:#F2F2F7;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --turq:#27B4C5; --turq-dark:#5CCAD7; --turq-soft:#113A40;
  --ink:#ECEBEB; --ink-2:#C2BEBE; --ink-3:#9A9595;
  --ground:#1A1D1E; --surface:#252A2B; --line:#3A4244; --line-2:#30373A;
  --amber:#F0B45A; --amber-soft:#3A2C12; --red:#FF8A80; --red-soft:#3D1D1B;
  --green:#6FD19D; --green-soft:#16362A; --grey-soft:#30373A;
  --bubble:#3A3A3C; --bubble-ink:#F2F2F7;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.6rem;font-weight:900}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:var(--turq-dark)}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}
.tiny{font-size:.8rem}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}

/* En-tête */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto}
.brand img{height:40px;width:auto;display:block}
.logo-dark{display:none!important}
.brand .name{font-weight:900;font-size:1.25rem;letter-spacing:.01em;border-left:2px solid var(--line);padding-left:14px}
.brand .name span{color:var(--turq)}
.menu{display:flex;gap:4px;flex-wrap:wrap}
.menu button{background:none;border:0;color:var(--ink-2);font:inherit;font-size:.95rem;padding:8px 10px;border-radius:8px;cursor:pointer}
.menu button:hover,.menu button[aria-current="page"]{background:var(--turq-soft);color:var(--turq-dark)}

/* Étapes */
.steps{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.steps .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.step{display:flex;align-items:center;gap:10px;padding:12px 8px;background:none;border:0;border-bottom:4px solid transparent;font:inherit;color:var(--ink-2);cursor:pointer;justify-content:center;font-weight:700;font-size:1.02rem}
.step .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);font-weight:900;font-size:.95rem}
.step[aria-current="page"]{color:var(--turq-dark);border-bottom-color:var(--turq)}
.step[aria-current="page"] .n{background:var(--turq);border-color:var(--turq);color:#fff}
.step:focus-visible,.btn:focus-visible,.menu button:focus-visible,.chip:focus-visible{outline:3px solid var(--turq);outline-offset:2px}

main{padding-block:22px 110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.section-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--turq-dark);font-weight:700}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:10px;border:2px solid var(--turq);background:var(--surface);color:var(--turq-dark);font:inherit;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--turq-soft)}
.btn.primary{background:var(--turq);color:#fff}
.btn.primary:hover{background:var(--turq-dark);border-color:var(--turq-dark)}
.btn.big{min-height:60px;font-size:1.12rem;padding:14px 24px}
.btn.wide{width:100%}
.btn.quiet{border-color:var(--line);color:var(--ink)}
.btn.quiet:hover{background:var(--grey-soft)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.92rem;border-width:1.5px}
.btn[disabled],.btn.disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--turq-dark);text-decoration:underline;cursor:pointer}

/* Formulaires */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
input[type=text],input[type=tel],input[type=email],input[type=search],input[type=number],select,textarea{font:inherit;font-weight:400;font-size:1rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:150px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--turq);box-shadow:0 0 0 3px var(--turq-soft)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:400}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--turq);flex:none}

/* Pastilles de statut */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.82rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-todo{background:var(--grey-soft);color:var(--ink-2)}
.st-prepared{background:var(--amber-soft);color:var(--amber)}
.st-confirmed{background:var(--green-soft);color:var(--green)}
.st-check{background:var(--red-soft);color:var(--red)}
.st-skipped{background:var(--grey-soft);color:var(--ink-3)}
.is-ok{background:var(--green-soft);color:var(--green)}
.is-warn{background:var(--amber-soft);color:var(--amber)}
.is-bad{background:var(--red-soft);color:var(--red)}
.is-info{background:var(--turq-soft);color:var(--turq-dark)}

/* Chiffres */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.tile .v{font-size:2rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:.9rem;color:var(--ink-2)}
.tile.main{border:2px solid var(--turq)}
.tile.main .v{color:var(--turq-dark)}

/* Tableaux */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:520px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{position:sticky;top:0;background:var(--surface);z-index:1;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);border-bottom:1.5px solid var(--line)}
tr.bad td{background:var(--red-soft)}
tr.warn td{background:var(--amber-soft)}
tr.off td{opacity:.55}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--turq-soft)}
tr.sel td{background:var(--turq-soft)}
td input[type=tel]{min-height:38px;padding:6px 8px;max-width:190px}
td .check input{margin:0}

/* Chips de filtre */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:.92rem;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* Bulle de message */
.phone{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;max-width:420px}
.phone .to{font-size:.85rem;color:var(--ink-2);text-align:center;border-bottom:1px solid var(--line-2);padding-bottom:8px;margin-bottom:12px}
.bubble{background:var(--bubble);color:var(--bubble-ink);border-radius:18px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:1rem;line-height:1.4;max-width:92%}
.bubble.mine{background:#0A84FF;color:#fff;margin-left:auto}

/* Encadrés */
.note{border-radius:10px;padding:12px 14px;font-size:.95rem;border:1px solid transparent}
.note.info{background:var(--turq-soft);border-color:color-mix(in srgb,var(--turq) 30%,transparent)}
.note.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
.note.bad{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.note.ok{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.note strong{font-weight:900}

.empty{border:2px dashed var(--line);border-radius:var(--radius);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;background:var(--surface)}
.listcard{display:flex;flex-direction:column;gap:10px}
.listcard .nm{font-weight:900;font-size:1.2rem;overflow-wrap:anywhere}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}

.recipient{display:flex;flex-direction:column;gap:6px;padding:18px;border:2px solid var(--turq);border-radius:var(--radius);background:var(--surface)}
.recipient .who{font-size:1.45rem;font-weight:900;line-height:1.2}
.recipient .num{font-size:1.2rem;font-weight:700}
.progress{height:10px;background:var(--grey-soft);border-radius:999px;overflow:hidden;display:flex}
.progress span{display:block;height:100%}

details.box{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.box>summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.box>summary::after{content:"+";font-weight:900;color:var(--turq)}
details.box[open]>summary::after{content:"–"}
details.box>.in{padding:0 16px 16px}
ol.steps-list{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px}
ol.steps-list li::marker{font-weight:900;color:var(--turq-dark)}
code,.code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:var(--grey-soft);padding:1px 6px;border-radius:5px}
kbd{font-family:inherit;font-weight:700;background:var(--grey-soft);border:1px solid var(--line);border-radius:5px;padding:0 6px}

.qrwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.qrwrap canvas{background:#fff;border-radius:8px;max-width:100%;height:auto;image-rendering:pixelated}

/* Fenêtre modale */
.modal-bg{position:fixed;inset:0;background:rgba(20,22,22,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.modal-bg{align-items:center}}
.modal video{width:100%;border-radius:12px;background:#000}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;z-index:200;max-width:min(92vw,560px);font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.25)}

.campbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.campbar label.f{flex:1 1 260px}

@media (max-width:760px){
  body{font-size:16.5px}
  h2{font-size:1.35rem}
  .brand img{height:32px}
  .brand .name{font-size:1.05rem;padding-left:10px}
  .menu{width:100%;justify-content:space-between}
  .menu button{padding:6px 8px;font-size:.9rem}
  .steps{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .steps .wrap{padding-inline:0}
  .step{flex-direction:column;gap:2px;font-size:.78rem;padding:8px 2px 6px;border-bottom:0;border-top:4px solid transparent}
  .step[aria-current="page"]{border-top-color:var(--turq)}
  .card{padding:16px}
  .hide-m{display:none}
}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.step{transition:background-color .15s,border-color .15s,color .15s}}
@media print{.steps,.menu{display:none}}
</style>
</head>

<script>'use strict';
/* ============================================================
   Le Pacte SMS — noyau (données, téléphones, CSV, Excel, transfert)
   Aucune donnée de contact n'est présente dans ce code.
   ============================================================ */
const APP_VERSION = '1.3.1';
const LS_KEY = 'lepactesms:v1';
const LS_PARTS = 'lepactesms:parts';
const DEFAULT_LINK = 'https://caravane-chateau-gombert-30-septembre.rmoreau-immo.chatgpt.site';
const OLD_MSG_V1 = 'Pardo & Chartier : caravane le 30/09 à 11h30, à Chateau-Gombert. Fiche et confirmation :\n' + DEFAULT_LINK;
const OLD_MSG_V12 = 'Bonjour {prénom}, on vous embarque ? Mercredi 30/09 à 11h30, la caravane Pardo & Chartier by Le Pacte Immo fait escale à Chateau-Gombert pour une villa avec piscine. Au plaisir de vous y retrouver ! Fiche et confirmation :\n' + DEFAULT_LINK;
const OLD_MSG_V13 = 'Bonjour {prénom},\nMercredi 30/09 à 11h30, la caravane Pardo & Chartier by Le Pacte Immo fait escale à Chateau-Gombert pour une villa avec piscine. Au plaisir de vous y retrouver ! Fiche et confirmation :\n' + DEFAULT_LINK;
const DEFAULT_MSG = 'Bonjour {prénom}, caravane Pardo & Chartier mer. 30/09 11h30 à Chateau-Gombert !\n' + DEFAULT_LINK;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, one, many) => n + ' ' + (n > 1 ? many : one);
const fmtDate = t => t ? new Date(t).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ---------- Stockage local ---------- */
let DB = null;
let STORAGE_OK = true;
function newCampaign(name, message) {
  return { id: uid(), name: name || 'Nouvelle campagne', created: Date.now(), message: message ?? '', link: '', cap: true,
    listIds: [], excluded: [], st: {}, paused: false, batch: null, frozen: null };
}
function defaultData() {
  const c = newCampaign('Caravane Château-Gombert 30/09', DEFAULT_MSG);
  c.link = DEFAULT_LINK;
  return { v: 1, lists: [], campaigns: [c], current: c.id,
    settings: { myNumber: '06 09 71 27 91', shortcut: 'Le Pacte SMS', batchSize: 10, device: '' } };
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    DB = raw ? JSON.parse(raw) : defaultData();
    if (!raw) localStorage.setItem(LS_KEY, JSON.stringify(DB));
  } catch (e) { STORAGE_OK = false; DB = defaultData(); }
  DB.lists ||= []; DB.campaigns ||= []; DB.settings = Object.assign(defaultData().settings, DB.settings || {});
  if (!DB.campaigns.length) { const c = newCampaign('Nouvelle campagne', ''); DB.campaigns.push(c); }
  if (!DB.campaigns.find(c => c.id === DB.current)) DB.current = DB.campaigns[0].id;
  // Mise à jour 1.2 : nouveau texte de la caravane, seulement si la campagne n'a pas commencé
  let upd = false;
  DB.campaigns.forEach(c => { if ([OLD_MSG_V1, OLD_MSG_V12, OLD_MSG_V13].includes(c.message) && !Object.keys(c.st || {}).length) { c.message = DEFAULT_MSG; upd = true; } });
  if (upd) try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {}
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); STORAGE_OK = true; }
  catch (e) { STORAGE_OK = false; toast("Attention : cet appareil refuse l'enregistrement. Faites une sauvegarde avant de fermer."); }
}
const curCamp = () => DB.campaigns.find(c => c.id === DB.current) || DB.campaigns[0];
const listById = id => DB.lists.find(l => l.id === id);

/* ---------- Téléphones ---------- */

  } else {

      l.contacts.forEach(ct => {
        total++;

        const ex = map.get(n.e164);

        map.set(n.e164, { e164: n.e164, display: n.display, prenom: ct.prenom, nom: ct.nom, agence: ct.agence, ville: ct.ville, lists: [l.name] });
      });

}

async function startImport(file, intoId) {
  const buf = await file.arrayBuffer();
  const isX = /\.xlsx$/i.test(file.name) || (new Uint8Array(buf.slice(0, 2))[0] === 0x50 && new Uint8Array(buf.slice(0, 2))[1] === 0x4B);
  if (/\.xls$/i.test(file.name)) throw new Error('Ancien format Excel (.xls) : ouvrez-le dans Excel puis « Enregistrer sous » .xlsx ou CSV.');
  const imp = { fileName: file.name, kind: isX ? 'xlsx' : 'csv', bytes: buf, state: {}, target: intoId || 'new',
    newName: file.name.replace(/\.(csv|txt|xlsx)$/i, '').replace(/[_]+/g, ' ').trim() };
  if (isX) { const x = await readXlsx(buf); imp.rows = x.rows; imp.sheet = x.sheet; imp.sheets = x.sheets; }
  else { const d = decodeText(buf); imp.enc = d.enc; imp.text = d.text; imp.delim = detectDelim(d.text); imp.rows = parseCSV(d.text, imp.delim); }
  prepImport(imp);
  UI.imp = imp; UI.ifilter = 'pb'; UI.view = 'listes'; render();
}
function prepImport(imp) {
  imp.rows = imp.rows.map(r => Array.from(r || [], v => v ?? ''));
  while (imp.rows.length && imp.rows[imp.rows.length - 1].every(v => !String(v).trim())) imp.rows.pop();
  const firstIdx = imp.rows.findIndex(r => r.some(v => String(v).trim()));
  if (firstIdx > 0) imp.rows = imp.rows.slice(firstIdx);
  imp.hasHeader = looksLikeHeader(imp.rows[0]);
  imp.width = Math.max(0, ...imp.rows.map(r => r.length));
  imp.map = guessMap(imp.hasHeader ? imp.rows[0] : null, imp.hasHeader ? imp.rows.slice(1) : imp.rows);
}
function analyzeImport(imp) {
  const data = imp.hasHeader ? imp.rows.slice(1) : imp.rows; const off = imp.hasHeader ? 2 : 1;
  const target = imp.target !== 'new' ? listById(imp.target) : null;
  const existing = new Set(target ? target.contacts.map(ct => normPhone(ct.tel).e164).filter(Boolean) : []);
  const seen = new Map(); const out = []; let blank = 0;
  data.forEach((row, i) => {
    const line = i + off;
    if (row.every(v => !String(v ?? '').trim())) { blank++; return; }
    const g = k => imp.map[k] >= 0 ? String(row[imp.map[k]] ?? '').trim() : '';
    const st = imp.state[line] || {};
    const tel = st.tel != null ? st.tel : g('tel');
    const n = normPhone(tel);
    let issue, dupOf = null;
    if (n.kind === 'empty') issue = 'vide';
    else if (n.kind === 'fixe') issue = 'fixe';
    else if (n.sci) issue = 'sci';
    else if (n.kind === 'invalid' || n.kind === 'special') issue = 'incorrect';
    else if (seen.has(n.e164)) { issue = 'doublon'; dupOf = seen.get(n.e164); }
    else if (existing.has(n.e164)) issue = 'existant';
    else issue = n.kind === 'intl' ? 'etranger' : n.fixed ? 'ajuste' : 'ok';
    if (n.e164 && !seen.has(n.e164)) seen.set(n.e164, line);
    const def = ['ok', 'etranger', 'ajuste'].includes(issue);
    out.push({ line, tel, n, issue, dupOf, edited: st.tel != null, include: st.include != null ? st.include : def,
      c: { prenom: g('prenom'), nom: g('nom'), agence: g('agence'), ville: g('ville'), email: g('email') } });
  });
  return { rows: out, blank };
}

/* ---------- QR codes ---------- */
function drawQR(canvas, text, cell) {
  const q = qrcode(0, 'L'); q.addData(text, 'Byte'); q.make();
  const n = q.getModuleCount(); const m = 4; const size = (n + m * 2) * cell;
  canvas.width = size; canvas.height = size; const g = canvas.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect((c + m) * cell, (r + m) * cell, cell, cell);
  return n;
}
const QR_CHUNK = 1250;
function appBase() { return location.href.split('#')[0].split('?')[0]; }
async function buildQR() {
  const c = curCamp(); const p = campaignPayload(c); const pk = await packJSON(p);
  const id = Math.random().toString(36).slice(2, 7); const parts = [];
  const N = Math.max(1, Math.ceil(pk.data.length / QR_CHUNK)); const size = Math.ceil(pk.data.length / N);
  for (let i = 0; i < pk.data.length; i += size) parts.push(pk.data.slice(i, i + size));
  UI.qr = { parts: parts.map((d, i) => appBase() + '#LPS1.' + id + '.' + (i + 1) + '.' + parts.length + '.' + pk.z + '.' + d), n: p.r.length }; UI.qrPart = 0;
}

  const z = $('#qr-zone'); if (!z || !UI.qr) return; const N = UI.qr.parts.length; const i = UI.qrPart;

    (N > 1 ? '<p class="small" style="text-align:center">' + (UI.qrAuto ? 'Les ' + N + ' QR codes défilent seuls : gardez l\'iPhone pointé sur l\'écran jusqu\'à « Campagne reçue ».' : 'Défilement arrêté.') + '</p><div class="row"><button class="btn sm" data-act="qrPrev">← Précédent</button><button class="btn sm" data-act="qrAuto">' + (UI.qrAuto ? 'Arrêter le défilement' : 'Reprendre le défilement') + '</button><button class="btn sm" data-act="qrNext">Suivant →</button></div>' : '') +

/* ---------- Réception (QR / lien / fichier) ---------- */
function readParts() { try { return JSON.parse(localStorage.getItem(LS_PARTS) || '{}'); } catch (e) { return {}; } }
function writeParts(p) { try { localStorage.setItem(LS_PARTS, JSON.stringify(p)); } catch (e) {} }
async function receiveString(str) {
  const m = /LPS1\.([a-z0-9]+)\.(\d+)\.(\d+)\.([01])\.([A-Za-z0-9_-]+)/.exec(str || '');
  if (!m) return { ok: false, msg: 'Ce QR code ne vient pas de Le Pacte SMS.' };
  const [, id, i, n, z, data] = m; const P = readParts();
  P[id] ||= { n: Number(n), z, got: {}, t: Date.now() }; P[id].got[i] = data;
  Object.keys(P).forEach(k => { if (Date.now() - P[k].t > 864e5) delete P[k]; });
  const got = Object.keys(P[id].got).length;
  if (got < Number(n)) { writeParts(P); return { ok: true, partial: true, got, n: Number(n) }; }
  const full = Array.from({ length: Number(n) }, (_, k) => P[id].got[k + 1]).join('');
  delete P[id]; writeParts(P);
  const payload = await unpackJSON(z, full);
  const res = importCampaignPayload(payload);
  return { ok: true, done: true, res };
}
function receivedMsg(res) {

    : 'Campagne « ' + res.c.name + ' » reçue : ' + plural(res.n, 'destinataire', 'destinataires') + '. Aucun SMS envoyé.';
}

    { sticky: true, onClose: cleanup, onOpen: async (el, close) => {

                const r = await receiveString(code.data);
                if (!r.ok) $('#scan-s').textContent = r.msg;

          }
          setTimeout(tick, 220);
        };

  const items = lot.map(r => ({ numero: r.e164, texte: personalize(c.message, r, c.cap) }));
  const href = shortcutHref(DB.settings.shortcut, items);
  const v = await modal('<h3>Envoyer ce lot de ' + lot.length + ' SMS ?</h3><p class="small">Le Raccourci « ' + esc(DB.settings.shortcut) + ' » va envoyer un message individuel à :</p><p class="small"><strong>' + lot.map(r => esc(capName(r.prenom) + ' ' + r.nom)).join(', ') + '</strong></p><p class="small muted">Ils passeront en « Message préparé » jusqu\'à votre confirmation.</p>' +
    '<div class="row" style="justify-content:flex-end"><button class="btn quiet" data-m="0">Annuler</button><a class="btn primary" data-m="go" href="' + esc(href) + '">Ouvrir Raccourcis et envoyer</a></div>');
  if (v !== 'go') return;
  lot.forEach(r => setStatus(c, r.e164, 'prepared', 'raccourci'));
  c.batch = { keys: lot.map(r => r.e164), t: Date.now() }; save(); setTimeout(render, 300);
};
ACT.robotCopy = async () => {
  const c = curCamp(); if (c.paused || c.batch) return;
  const lot = recipientsOf(c).active.filter(r => statusOf(c, r.e164) === 'todo');
  if (!lot.length) return;
  const json = JSON.stringify({ liste: lot.map(r => ({ numero: r.e164, texte: personalize(c.message, r, c.cap) })) });
  const ok = await copyText(json);
  if (!ok) return toast('Copie impossible sur cet appareil. Utilisez l\'envoi par petits lots.');
  UI.robotKeys = lot.map(r => r.e164); render(); toast(plural(lot.length, 'destinataire prêt', 'destinataires prêts') + '. Aucun SMS envoyé pour l\'instant.');
};
ACT.robotCancel = () => { UI.robotKeys = null; copyText(' '); render(); };
ACT.robotGo = (b, e) => {
  const c = curCamp(); if (c.paused || c.batch || !UI.robotKeys) { e.preventDefault(); return; }
  const keys = UI.robotKeys.filter(k => statusOf(c, k) === 'todo');
  keys.forEach(k => setStatus(c, k, 'prepared', 'robot'));
  c.batch = { keys, t: Date.now(), robot: true }; UI.robotKeys = null; save();
  setTimeout(render, 400);
};
ACT.bDone = () => { const c = curCamp(); if (!c.batch) return; c.batch.keys.forEach(e => setStatus(c, e, 'confirmed', 'vous (lot)')); c.batch = null; save(); render(); toast('Lot confirmé.'); };
ACT.bCheck = () => { const c = curCamp(); if (!c.batch) return; c.batch.keys.forEach(e => setStatus(c, e, 'check', 'vous (lot)')); c.batch = null; save(); render(); toast('Lot à vérifier : corrigez chaque statut dans la liste.'); };
ACT.backup = () => download('Le_Pacte_SMS_sauvegarde_' + today() + '.json', JSON.stringify({ app: 'lepactesms', type: 'sauvegarde', version: APP_VERSION, date: new Date().toISOString(), data: DB }), 'application/json');
ACT.wipe = async () => {
  if (!await ask('Tout effacer sur cet appareil ?', '<p>Listes, campagnes, suivis et réglages seront supprimés. Cette action est définitive. Pensez à télécharger une sauvegarde avant.</p>', 'Tout effacer', 'danger')) return;
  try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_PARTS); } catch (e) {}
  DB = defaultData(); save(); UI.openList = null; UI.imp = null; go('listes'); toast('Données effacées.');
};

/* ----- Champs ----- */
ON.pickCamp = el => { DB.current = el.value; UI.qr = null; UI.sel = null; save(); render(); };
ON.renameList = el => { const l = listById(UI.openList); if (l && el.value.trim()) { l.name = el.value.trim(); save(); } };
ON.lsearch = el => { UI.lsearch = el.value; renderListTable(); };
ON.cfTel = () => cfTelCheck();
ON.mapCol = el => { UI.imp.map[el.dataset.k] = Number(el.value); UI.imp.state = {}; renderImportTable(); };
ON.impHead = el => { UI.imp.hasHeader = el.checked; UI.imp.map = guessMap(el.checked ? UI.imp.rows[0] : null, el.checked ? UI.imp.rows.slice(1) : UI.imp.rows); UI.imp.state = {}; render(); };
ON.impDelim = el => { const imp = UI.imp; imp.delim = el.value === 'TAB' ? '\t' : el.value; imp.rows = parseCSV(imp.text, imp.delim); imp.state = {}; prepImport(imp); render(); };
ON.impEnc = el => { const imp = UI.imp; imp.enc = el.value; imp.text = new TextDecoder(el.value === 'UTF-8' ? 'utf-8' : 'windows-1252').decode(new Uint8Array(imp.bytes)).replace(/^﻿/, ''); imp.rows = parseCSV(imp.text, imp.delim); imp.state = {}; prepImport(imp); render(); };
ON.impTarget = el => { UI.imp.target = el.value; render(); };
ON.impName = el => { UI.imp.newName = el.value; };
ON.impInc = el => { const L = el.dataset.line; (UI.imp.state[L] ||= {}).include = el.checked; renderImportTable(); };
ON.impTel = el => { const L = el.dataset.line; const st = (UI.imp.state[L] ||= {}); st.tel = el.value; const n = normPhone(el.value); if (sendable(n)) st.include = true; renderImportTable(); };
ON.campName = el => { curCamp().name = el.value.trim() || 'Campagne sans nom'; save(); const o = $('#camp-pick option:checked'); if (o) o.textContent = curCamp().name; };
ON.campMsg = el => { curCamp().message = el.value; save(); renderMsgPreview(); };
ON.campCap = el => { curCamp().cap = el.checked; save(); renderMsgPreview(); };
ON.campLink = el => { curCamp().link = el.value.trim(); save(); };
ON.campList = el => { const c = curCamp(); const id = el.dataset.id; c.listIds = el.checked ? [...new Set([...c.listIds, id])] : c.listIds.filter(x => x !== id); save(); render(); };
ON.exToggle = el => { const c = curCamp(); const e = el.dataset.e; const s = new Set(c.excluded || []); el.checked ? s.delete(e) : s.add(e); c.excluded = [...s]; save(); render(); };
ON.vsearch = el => { UI.vsearch = el.value; renderVerify(); };
ON.setSt = async el => {
  const c = curCamp(); const e = el.dataset.e; const old = statusOf(c, e); const nv = el.value;
  if (old === 'confirmed' && nv === 'todo' && !await ask('Remettre « à préparer » ?', '<p>Cette personne a déjà reçu le message selon votre confirmation. Elle pourrait le recevoir deux fois.</p>', 'Remettre à préparer', 'danger')) { el.value = old; return; }
  setStatus(c, e, nv, 'vous'); save(); render();
};
ON.bSize = el => { DB.settings.batchSize = Number(el.value); save(); render(); };
ON.setNum = el => { DB.settings.myNumber = el.value; save(); };
ON.setSc = el => { DB.settings.shortcut = el.value.trim() || 'Le Pacte SMS'; save(); };
ON.setDevSel = el => { DB.settings.device = el.value; save(); };

/* ----- Fichiers ----- */
async function onImportFile(file) {
  if (!file) return;
  try { await startImport(file, UI.importInto); }
  catch (e) { modal('<h3>Import impossible</h3><p>' + esc(e.message) + '</p><button class="btn primary" data-m="1">Compris</button>'); }
}
async function onJSONFile(file) {
  if (!file) return;
  try {
    const obj = JSON.parse(await file.text());
    if (obj.app !== 'lepactesms') throw new Error("Ce fichier ne vient pas de Le Pacte SMS.");
    if (obj.type === 'campagne') { const res = importCampaignPayload(obj.payload); UI.view = 'envoyer'; render(); toast(receivedMsg(res), 6000); return; }
    if (obj.type === 'sauvegarde') {
      const v = await modal('<h3>Restaurer la sauvegarde du ' + esc(fmtDate(obj.date)) + '</h3><p class="small">' + obj.data.lists.length + ' liste(s), ' + obj.data.campaigns.length + ' campagne(s).</p><p class="small"><strong>Fusionner</strong> ajoute ce qui manque et garde vos données actuelles. <strong>Remplacer</strong> efface d\'abord les données de cet appareil.</p><div class="row" style="justify-content:flex-end"><button class="btn quiet" data-m="0">Annuler</button><button class="btn danger" data-m="replace">Remplacer</button><button class="btn primary" data-m="merge">Fusionner</button></div>');
      if (!v || v === '0') return;
      if (v === 'replace') DB = obj.data;
      else {
        obj.data.lists.forEach(l => { if (!listById(l.id)) DB.lists.push(l); });
        obj.data.campaigns.forEach(c => { const ex = DB.campaigns.find(x => x.id === c.id); if (!ex) DB.campaigns.push(c); else Object.entries(c.st || {}).forEach(([e, s]) => { const cur = ex.st[e]; if (!cur || ST_RANK[s.s] > ST_RANK[cur.s]) ex.st[e] = s; }); });
      }
      save(); load(); render(); toast('Sauvegarde restaurée.'); return;
    }
    throw new Error('Type de fichier inconnu.');
  } catch (e) { modal('<h3>Fichier illisible</h3><p>' + esc(e.message) + '</p><button class="btn primary" data-m="1">Compris</button>'); }
}

/* ----- Démarrage ----- */
function boot() {
  load();
  document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.closest('[disabled]')) return;
    const inner = e.target.closest('input,select,textarea,label'); if (inner && b.contains(inner) && inner !== b) return; const f = ACT[b.dataset.act]; if (f) { if (b.tagName !== 'A') e.preventDefault(); f(b, e); } });
  document.addEventListener('change', e => { const el = e.target.closest('[data-on]'); if (el && ['checkbox', 'select-one'].includes(el.type)) ON[el.dataset.on]?.(el, e); else if (el && ['impTel', 'renameList', 'campName', 'campLink', 'setNum', 'setSc', 'impName'].includes(el.dataset.on)) ON[el.dataset.on]?.(el, e); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-on]'); if (el && ['lsearch', 'vsearch', 'campMsg', 'cfTel', 'impName', 'campLink'].includes(el.dataset.on)) ON[el.dataset.on]?.(el, e); });
  $('#file-import').addEventListener('change', e => onImportFile(e.target.files[0]));
  $('#file-json').addEventListener('change', e => onJSONFile(e.target.files[0]));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && UI.view === 'envoyer') { try { load(); } catch (e) {} render(); } });
  window.addEventListener('hashchange', handleHash);
  render(); handleHash();
}
boot();
</script>
</body>
